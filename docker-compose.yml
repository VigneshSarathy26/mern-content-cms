version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: inventory_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - inventory-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - inventory-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/mern_inventory_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_inventory_pro_2026
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - inventory-net

  mongodb:
    image: mongo:6.0
    container_name: inventory_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - inventory-net

  redis:
    image: redis:7.0-alpine
    container_name: inventory_redis
    ports:
      - "6379:6379"
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  mongo-data:
